<!--suppress ALL -->
<!DOCTYPE html>
  
  <!-- Upload -->
  
<html lang="en">
<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
</head>
<body>
  <style>
  </style>
    <center>
    <h1>Upload Media</h1><br><br>
    Random file names: <input id="norandom" type="checkbox">
    <br><br>
    <label>Images:</label>
    <input type="file" accept="image/*" name="photos" multiple id="photosInput">
    <br>
    <label>Videos:</label>
    <input type="file" accept="video/*" name="videos" multiple id="videosInput">
    <br>
    <label>Or Anything!:</label>
    <input type="file" accept="*" name="any" multiple id="anyInput">
    <br><br><br>
    <input type="hidden" name="changes" id="changesE" value=""><br>
    <button style="position:relative;top:50px;" id="submit">Submit!</button>
    <br clear="all"><br><br><br><br><br><br>
    <div id="photos"></div>
    <div id="videos"></div>
    <div id="files"></div>
    </center>
    <div id="messageDiv" style="z-index:-10;"></div>
    <script>
      document.getElementById("messageDiv").style.position="absolute";
      document.getElementById("messageDiv").style.top=0;
      document.getElementById("messageDiv").style.left=0;
      document.getElementById("messageDiv").style.width=window.innerWidth+"px";
      document.getElementById("messageDiv").style.height=window.innerHeight+"px";
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has("badName")){
        var badNameM = document.createElement("p");
        badNameM.style.position = "relative";
        badNameM.style.top = window.innerHeight*0.5+"px";
        badNameM.style.fontSize = "45px";
        badNameM.id="badNameMessage";
        badNameM.append("Please enter a name without special characters! ALSO IF U HIT SUBMIT WITHOUT ENTERING A NAME YOU R POOPY enter a name this time okay"); //i didn't say numbers were okay cuz idk how they are affected by .toUpperCase()/.toLowerCase

        var center = document.createElement("center");
        document.getElementById("messageDiv").appendChild(center);
        center.appendChild(badNameM);
        setTimeout(()=>{
          var iter=0;
          var interval = setInterval(()=>{
            if (iter<=100){
              document.getElementById("badNameMessage").style.opacity=100-1*iter+"%";
              iter++;
            } else {
              clearInterval(interval);
            }
          },10)
        },4000)
      }

      const specialChars = "!@#$%^&*()-=_+[]{}|;':\".,<>/\?`~\\";
      function isNoSpChar(str) {
        for (var i = 0; i < str.length; i++) {
          if (specialChars.indexOf(str.charAt(i)) !== -1) {
            return false;
          }
        }
        return true;
      }

      var renameEventListener = function(element){
        element.addEventListener("click", function(){
          function recurseNewName(e){
            var newName = prompt("What do you want to rename this file to?");
            if (newName !== null && newName.trim() !== "" && isNoSpChar(newName)){
              newName = newName.trim();
              var renames = document.getElementById("changesE").value;
              var contents = renames==="" ? [] : JSON.parse(renames); //an array of renamed names
              var ext = e.innerHTML.substring(e.innerHTML.indexOf(".")); //eg: .png  !w/ period!

              //this step is only for selecting the json file to edit in the array
              var l = contents.length;
              
              var index = -1;
              var i=0;
              do {
                if (contents.length===0){
                  break;
                }
                if (e.innerHTML === contents[i].name){
                  //exists
                  index=i;
                }
                i++
              } while (i<l);
              if (index!==-1)  contents[index].name = newName+ext
              else  contents.push(JSON.parse("{\"name\":\""+newName+ext+"\", \"originalName\":\""+e.innerHTML+"\"}"));
              
              document.getElementById("changesE").value = "";
              document.getElementById("changesE").value = JSON.stringify(contents);
              e.innerHTML = "";
              e.append(newName+ext);
            } else {
              recurseNewName(e);
            }
          };
          recurseNewName(this);
        })
      }

      var photoDates = []
      var videoDates = []
      document.getElementById("photosInput").onchange = ()=>{
        document.getElementById("photos").innerHTML = "";
        photoDates = []
        for (var i=0;i<document.getElementById("photosInput").files.length;i++){
          var p = document.createElement("p");
          p.innerHTML = document.getElementById("photosInput").files[i].name + "  ["+new Date(document.getElementById("photosInput").files[i].lastModified)+"]";
          photoDates.push(document.getElementById("photosInput").files[i].lastModified)
          p.style.color = "darkBlue";
          p.id = "nameText" + i;
          document.getElementById("photos").appendChild(p);
          
          renameEventListener(p);
        }
      }
      document.getElementById("videosInput").onchange = ()=>{
        document.getElementById("videos").innerHTML = "";
        videoDates = []
        for (var i=0;i<document.getElementById("videosInput").files.length;i++){
          var p = document.createElement("p");
          p.innerHTML = document.getElementById("videosInput").files[i].name + "  ["+new Date(document.getElementById("videosInput").files[i].lastModified)+"]";
          videoDates.push(document.getElementById("videosInput").files[i].lastModified)
          p.style.color = "darkBlue";
          p.id = "nameText" + i;
          document.getElementById("videos").appendChild(p);
          
          renameEventListener(p);
        }
      }
      document.getElementById("anyInput").onchange = ()=>{
        document.getElementById("files").innerHTML = "";
        for (var i=0;i<document.getElementById("anyInput").files.length;i++){
          var p = document.createElement("p");
          p.append(document.getElementById("anyInput").files[i].name);
          p.style.color = "darkBlue";
          p.id = "nameText" + i;
          document.getElementById("files").appendChild(p);
          
          renameEventListener(p);
        }
      }
      document.getElementById("submit").addEventListener("click",function(){
        var form = document.createElement("form");
        form.action="/uploading";
        form.method="post";
        form.enctype="multipart/form-data";

        var images = document.createElement("input");
        images.type="file";
        images.name="photos";
        images.accept="image/*"
        images.files=document.getElementById("photosInput").files;

        var videos = document.createElement("input");
        videos.type="file";
        videos.name="videos";
        videos.accept="video/*"
        videos.files=document.getElementById("videosInput").files;

        var anything = document.createElement("input");
        anything.type="file";
        anything.name="any";
        anything.accept="*";
        anything.files=document.getElementById("anyInput").files;

        //<input type="hidden" name="changes" id="changesE" value=""><br>
        var changes = document.createElement("input");
        changes.type="hidden";
        changes.name="changes";
        changes.value=document.getElementById("changesE").value;

        var norandom = document.createElement("input");
        norandom.type="hidden";
        norandom.name="norandom";
        if (document.getElementById("norandom").checked)norandom.value="false";else norandom.value="true";

        var allDates = []
        //here add code that gets file name and is able to pair those with their dates
        for (var i=0;i<photoDates.length+videoDates.length;i++) allDates.push([])
        for (var i=0;i<photoDates.length;i++){
          allDates[i].push(document.getElementById("photosInput").files[i].name)
          allDates[i].push(photoDates[i])
        }
        for (var i=0;i<videoDates.length;i++){
          allDates[i].push(document.getElementById("videosInput").files[i].name)
          allDates[i].push(videoDates[i])
        }
        var dates = document.createElement("input");
        dates.type="hidden"
        dates.name="dates"
        dates.value=JSON.stringify({dates:allDates})

        form.appendChild(images);
        form.appendChild(videos);
        form.appendChild(dates);
        form.appendChild(anything);
        form.appendChild(norandom);
        form.appendChild(changes);
        document.body.appendChild(form);
        form.submit();
      })
    </script>
</body>
</html>
